name: Telegram daily post
on:
  schedule:
    - cron: '0 16 * * *'   # 19:00 Israel (UTC+3)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tg/post_next.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - run: |
          git config user.name "ufo-bot"; git config user.email "bot@ufo.org.il"
          git add tg/posted.json && git commit -m "tg posted" || true
          git push || true
